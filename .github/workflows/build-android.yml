# ============================================================================
# FLASHPAY APP (Flutter) : COMPILER L'APK SUR GITHUB
# ============================================================================
# AVANT LE PREMIER LANCEMENT (une seule fois)
#   1. Dépôt GitHub > Settings > Secrets and variables > Actions > "New repository secret"
#      - API_URL              (obligatoire) adresse de l'API Render, SANS slash final
#                             ex. https://flashpay-backend.onrender.com
#      - GOOGLE_SERVICES_JSON (pour le KYC) tout le contenu du fichier google-services.json
#                             (Firebase > Paramètres du projet > Vos applications > Android).
#                             L'identifiant Android de l'app Firebase doit être :
#                             ci.flashpay.flashpay_app
#                             Sans ce secret, l'APK est compilé SANS Firebase : le KYC ne marchera pas.
#
# LANCER UNE COMPILATION
#   - Automatique à chaque push sur la branche "main".
#   - À la main : onglet Actions > "Build Android" > bouton "Run workflow".
#
# RÉCUPÉRER L'APK
#   Onglet Actions > cliquer sur l'exécution (coche verte) > en bas, section "Artifacts"
#   > "flashpay-apk" (zip contenant app-release.apk) > l'installer sur le téléphone Android.
#
# SI ÇA ÉCHOUE (croix rouge)
#   Ouvrir l'exécution > cliquer sur l'étape en rouge > copier les dernières lignes d'erreur.
#   - Échec à "Permissions et Gradle"  : le modèle Android de Flutter a changé, voir tools/ci_prepare_android.py
#   - Échec à "flutter test"           : un test unitaire ne passe plus
#   - API_URL vide                     : le secret n'est pas créé ou mal orthographié
#
# LIMITES
#   - L'APK est signé avec la clé de debug : OK pour tester et installer, pas pour le Play Store
#     (il faudra une clé de signature).
#   - iOS n'est pas compilé ici (compte Apple Developer nécessaire).
#   - android/ et ios/ ne sont PAS dans le dépôt : ils sont régénérés à chaque compilation.
#     Le code de l'app est dans lib/.
# ============================================================================

name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android/ et ios/ ne sont pas versionnés : on les génère ici (lib/ n'est pas touché).
      - name: Générer les dossiers de plateforme
        run: flutter create . --org ci.flashpay --project-name flashpay_app --platforms android

      - name: Firebase (facultatif)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "Pas de GOOGLE_SERVICES_JSON : l'app sera compilée sans Firebase (le KYC ne fonctionnera pas)."
          fi

      - name: Permissions et Gradle
        run: |
          python3 tools/apply_platform_config.py
          python3 tools/ci_prepare_android.py

      - run: flutter pub get
      - run: flutter test

      - name: Compiler l'APK
        run: flutter build apk --release --dart-define=API_URL=${{ secrets.API_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: flashpay-apk
          path: build/app/outputs/flutter-apk/app-release.apk
