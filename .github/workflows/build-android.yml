# ============================================================================
# FLASHPAY APP (Flutter) : COMPILER ET PUBLIER UNE NOUVELLE VERSION
# ============================================================================
# SECRETS À CRÉER (une seule fois) : Dépôt GitHub > Settings > Secrets and variables > Actions
#   - API_URL              (obligatoire) adresse de l'API Render, SANS slash final
#   - GOOGLE_SERVICES_JSON (KYC) tout le contenu du fichier google-services.json
#   - KEYSTORE_PASSWORD    (obligatoire) mot de passe de la clé de signature (voir « Créer la clé de signature »)
#
# PUBLIER UNE VERSION
#   - Automatique à chaque envoi de fichiers sur la branche "main".
#   - À la main : onglet Actions > "Build Android" > Run workflow.
#   - Facultatif : écrire le texte de la mise à jour dans un fichier notes.txt à la racine du dépôt.
#
# LIEN DE TÉLÉCHARGEMENT UNIQUE (toujours la dernière version) :
#   https://github.com/solplay-app/FLASHPAY-ANDROID/releases/latest/download/flashpay.apk
#   (le dépôt doit être PUBLIC pour que ce lien marche pour tout le monde)
#
# MISE À JOUR DANS L'APPLICATION : Compte > Mise à jour, et proposition automatique à l'ouverture.
# La nouvelle version s'installe par-dessus l'ancienne : les données sont conservées.
#
# SI ÇA ÉCHOUE (croix rouge) : ouvrir l'exécution > cliquer sur l'étape en rouge > copier les dernières lignes d'erreur.
# ============================================================================

name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android/ et ios/ ne sont pas versionnés : on les génère ici (lib/ n'est pas touché).
      - name: Générer les dossiers de plateforme
        run: flutter create . --org ci.flashpay --project-name flashpay_app --platforms android

      - name: Icône FlashPay
        run: cp -r android_res/. android/app/src/main/res/

      - name: Nom de l'application
        run: sed -i 's/android:label="[^"]*"/android:label="FlashPay"/' android/app/src/main/AndroidManifest.xml

      - name: Firebase (facultatif)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "Pas de GOOGLE_SERVICES_JSON : l'app sera compilée sans Firebase (le KYC ne fonctionnera pas)."
          fi

      - name: Paquets des mises à jour
        run: |
          grep -q '^  ota_update:' pubspec.yaml || flutter pub add ota_update
          grep -q '^  url_launcher:' pubspec.yaml || flutter pub add url_launcher

      - name: Permissions et Gradle
        run: |
          python3 tools/apply_platform_config.py
          python3 tools/ci_prepare_android.py

      - name: Permission d'installer les mises à jour
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q REQUEST_INSTALL_PACKAGES "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <application#' "$M"

      - name: Clé de signature
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ ! -f tools/release.keystore.enc ]; then
            echo "Clé de signature absente : lancer d'abord le workflow « Créer la clé de signature »."
            exit 1
          fi
          if [ -z "$KS_PASS" ]; then
            echo "Le secret KEYSTORE_PASSWORD est manquant."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in tools/release.keystore.enc -out android/app/release.keystore -pass env:KS_PASS
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=flashpay\nstoreFile=release.keystore\n' "$KS_PASS" "$KS_PASS" > android/key.properties
          python3 tools/ci_signing.py

      - run: flutter pub get
      - run: rm -f test/widget_test.dart && flutter test

      - name: Compiler l'APK
        run: |
          flutter build apk --release \
            --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} \
            --dart-define=API_URL=${{ secrets.API_URL }} \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} --dart-define=BUILD_NAME=1.0.${{ github.run_number }}

      - name: Préparer la publication
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk flashpay.apk
          if [ -f notes.txt ]; then cp notes.txt notes_release.txt; else echo "Améliorations et corrections." > notes_release.txt; fi
          python3 - <<'PY'
          import json, os
          n = os.environ['GITHUB_RUN_NUMBER']
          notes = open('notes_release.txt', encoding='utf-8').read().strip()[:300]
          json.dump({'versionCode': int(n), 'versionName': '1.0.' + n, 'notes': notes}, open('version.json', 'w', encoding='utf-8'), ensure_ascii=False)
          PY

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: FlashPay 1.0.${{ github.run_number }}
          body_path: notes_release.txt
          make_latest: true
          files: |
            flashpay.apk
            version.json
